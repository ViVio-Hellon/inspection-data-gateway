# デスクトップ版(Windows)を作って確かめる
#
# 作るもの: UFKensa.exe(成果物 "UFKensa-windows" から取れる)。
# 配るときは、ツールのフォルダの直下に置いてから scripts\make_dist.bat を流す
# (make_dist が「UF検査判定.exe」の名前で入れる)。
#
# 確かめること:
#   - Python の試験(Windows の上で。標準入出力のやりとりは OS で違いが出やすい)
#   - Rust の試験
#   - 作った exe を本当に起動し、画面が Python から届くこと・ポートで待ち受けないこと・
#     止めたら Python も終わること(scripts/desktop_smoke.py)
name: デスクトップ版(Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Node.js 24 で動く版(Node.js 20 の版は 2026 年に打ち切り。試験 test_ci_workflow で固定)
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python の部品を入れる
        run: python -m pip install -r requirements.txt pytest

      # デスクトップ版のつなぎ(標準入出力・同時起動の錠)は、exe を作る前に必ず通す
      - name: Python の試験(デスクトップ版のつなぎ)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -p no:cacheprovider tests/test_bridge.py tests/test_launch_join.py

      # 全件(業務の試験)。これまで Linux で回してきたので、Windows で落ちるものは知らせるだけにして exe は作る
      - name: Python の試験(全件・Windows での確かめ)
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -p no:cacheprovider

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust の試験
        working-directory: src-tauri
        run: cargo test --release

      - name: exe を作る
        working-directory: src-tauri
        run: cargo build --release

      - name: 作った exe を起動して確かめる
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/desktop_smoke.py --exe src-tauri/target/release/UFKensa.exe

      - uses: actions/upload-artifact@v6
        with:
          name: UFKensa-windows
          path: src-tauri/target/release/UFKensa.exe
          if-no-files-found: error
