{% extends "base.html" %}
{% block title %}全ヵ所 — {{ display_name }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/zenkasho.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/pack_dialog.css') }}">
<div class="zk" id="zk">
  <!-- 上: 作業の切替(選んだものを常に見せる)と、止まっているときの帯 -->
  <div class="zk__top">
    <div class="zk-modes" id="modes" role="tablist" aria-label="作業選択"></div>
    <span class="zk-line" id="lineName"></span>
    <p class="zk-notice" id="notice" hidden></p>
  </div>
  <!-- 2026-11-26(現場の声): 「処理再開」は無くした。止まった判定は次の操作の始めに自動で戻る -->

  <div class="zk__body">
    <!-- 左: ロット・検査員・MINMAX と検査法・検入高さ・シート発行(VBA のフォーム) -->
    <div class="zk__col">
      <section class="card">
        <header><h3>ロット</h3></header>
        <div class="pad zk-form">
          <label>LotNo<input class="input" id="fLot" maxlength="7" autocomplete="off" placeholder="7桁"></label>
          <label>検査番号<input class="input" id="fKenNo" autocomplete="off"></label>
          <label>用途ｺｰﾄﾞ<input class="input" id="fYouto" autocomplete="off"></label>
          <label>検査員名<input class="input" id="fKname" autocomplete="off"></label>
        </div>
      </section>
      <section class="card">
        <header><h3>MIN / MAX と転送</h3></header>
        <div class="pad zk-form">
          <div class="zk-pair">
            <label>Start板番号<input class="input" id="fMin" inputmode="numeric" autocomplete="off"></label>
            <label>End板番号<input class="input" id="fMax" inputmode="numeric" autocomplete="off"></label>
          </div>
          <div class="zk-seg" id="methods" role="radiogroup" aria-label="検査法"></div>
          <button class="btn btn--run" type="button" id="transferBtn">決定(最大最少 → Aインプット)</button>
          <a class="btn btn--nav" id="ainputLink" href="/ainput" hidden>Aインプットへ</a>
        </div>
      </section>
      <section class="card">
        <header><h3>検入高さ</h3></header>
        <div class="pad zk-form">
          <div class="zk-seg" id="yama" role="radiogroup" aria-label="山数選択"></div>
          <div class="zk-kenh" id="kenh"></div>
          <p class="muted zk-formula" id="formula"></p>
          <button class="btn btn--commit" type="button" id="heightBtn">高さを記録(AD1:AD3)</button>
        </div>
      </section>
      <section class="card">
        <header><h3>シート</h3></header>
        <div class="pad">
          <div class="btn-row">
            <button class="btn btn--danger" type="button" id="newBtn">ｼｰﾄ発行(新規)</button>
          </div>
        </div>
      </section>
    </div>

    <!-- 中央: シートの上部(公差など)と測定の表 -->
    <div class="zk__col zk__center">
      <section class="card">
        <div class="pad"><dl class="zk-head" id="head"></dl></div>
      </section>
      <section class="card zk-tablecard">
        <div class="zk-tablewrap" id="tableWrap">
          <table class="zk-table" id="sheet" aria-label="測定値"></table>
        </div>
      </section>
      <div class="zk-flash" id="flash" hidden></div>
    </div>

    <!-- 右: 次に測る欄・入力・操作 -->
    <div class="zk__col">
      <div class="next" id="nextBox"><small>次に入力する欄</small><b id="nextName">-</b><small id="nextHint"></small></div>
      <!-- 2026-11-26(現場の声): 入力欄・「この欄を消す」は見せない(通常検査と同じ)。表のセルを選んで、そのまま打つ・測る -->
      <label class="recv sheet-recv" id="recvBox" for="measIn"><span class="recv__state" id="recvState">受信待ち</span>
        <input class="recv__in" id="measIn" autocomplete="off" aria-label="選んだセルへ入れる(測定器・キーボード)" tabindex="-1">
        <small class="sheet-keys">セルを押して選ぶ → 測る / 打って Enter ・ 矢印キーで移動 ・ Delete・Back space で消す</small>
      </label>
      <div class="btn-row"><button class="btn" type="button" id="emptyBtn">厚の空き欄へ</button>
        <button class="btn" type="button" id="judgeWinBtn" title="VBA の判定表示のように、板No・位置・○×を別の窓に大きく出します">判定を別窓で大きく表示</button></div>
      <section class="card">
        <header><h3>印刷・保存</h3></header>
        <div class="pad">
          <div class="btn-row" id="prints"></div>
          <ul class="zk-files" id="reports"></ul>
        </div>
      </section>
      <section class="card">
        <header><h3>記録</h3></header>
        <div class="pad">
          <ul class="log-lines" id="recent"></ul>
          <p class="muted zk-pending" id="pending"></p>
        </div>
      </section>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/views/zenkasho.js') }}"></script>
{% endblock %}
